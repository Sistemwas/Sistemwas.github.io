<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos y Finanzas</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1c1e21;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .app-icon {
            width: 96px;
            height: 96px;
            background-color: #4A3B8C;
            border-radius: 22px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            color: white;
            box-shadow: 0 4px 10px rgba(74, 59, 140, 0.3);
        }
        h1 {
            font-size: 24px;
            margin: 0 0 12px;
            color: #000000;
        }
        p {
            font-size: 16px;
            color: #65676b;
            margin: 0 0 32px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            background-color: #4A3B8C;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 16px;
            border-radius: 12px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active, .btn:hover {
            background-color: #362a6b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="app-icon">📊</div>
        <h1>Control de Gastos y Finanzas</h1>
        <p>La forma más rápida de registrar tus gastos diarios y organizar tu presupuesto.</p>
        <a href="https://play.google.com/store/apps/details?id=com.sistemaswas.presupuestoycontroldegastos&referrer=utm_source%3Dfacebook%26utm_medium%3Dcpc%26utm_campaign%3Dvideo_combustible" class="btn">
            Descargar GRATIS
        </a>
    </div>
</body>
</html>
